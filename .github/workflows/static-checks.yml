name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1 parser
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Parse every Lua file
        run: |
          find . -type f -name '*.lua' -not -path './.git/*' -print0 \
            | sort -z \
            | xargs -0 -n 1 luac5.1 -p

      - name: Validate manifest and documentation
        run: python3 tools/check_repo.py
