name: Converge deep addon audit

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: roth-tooltip-deep-audit-convergence
  cancel-in-progress: false

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cancel superseded repository-mutating audit runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse

          repo = os.environ["GITHUB_REPOSITORY"]
          current = int(os.environ["GITHUB_RUN_ID"])
          mutating_names = {
              "Deep ownership audit",
              "Deep ownership audit v2",
              "Promote deep ownership audit",
              "Promote deep ownership audit v2",
              "Canonical deep audit finalizer",
              "Deep functional module audit",
              "Apply single Retail 12.1 runtime",
              "Finalize Retail 12.1 refactor into main",
              "Force-finalize validated Retail 12.1 tree",
              "Authoritative Retail 12.1 finalizer",
              "Finalize and report Retail 12.1",
              "Main authoritative Retail 12.1 finalizer",
              "Final Retail 12.1 runtime hardening",
              "Corrected final Retail 12.1 hardening",
              "Canonical final Retail 12.1 normalization",
              "Order-independent canonical Retail 12.1 finalizer",
          }
          for status in ("queued", "in_progress"):
              raw = subprocess.check_output([
                  "gh", "api", f"/repos/{repo}/actions/runs?status={status}&per_page=100"
              ], text=True)
              for run in json.loads(raw).get("workflow_runs", []):
                  if run.get("id") == current or run.get("name") not in mutating_names:
                      continue
                  subprocess.run([
                      "gh", "api", "--method", "POST",
                      f"/repos/{repo}/actions/runs/{run['id']}/cancel"
                  ], check=False)
          PY
          sleep 12

      - name: Reset to the latest published main
        run: |
          cp .github/workflows/deep-audit-convergence.yml /tmp/deep-audit-convergence.yml
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .github/workflows
          cp /tmp/deep-audit-convergence.yml .github/workflows/deep-audit-convergence.yml

      - name: Materialize ownership refactor if an earlier audit never published
        run: |
          if [ -f Engine/Schema.lua ] && [ -f OWNERSHIP.md ] && [ -f tests/schema_ownership.lua ]; then
            exit 0
          fi

          if git fetch origin audit/deep-ownership-pass:refs/remotes/origin/audit/deep-ownership-pass; then
            if git cat-file -e origin/audit/deep-ownership-pass:tools/deep_audit_architecture.py 2>/dev/null; then
              git show origin/audit/deep-ownership-pass:tools/deep_audit_architecture.py > /tmp/deep_audit_architecture.py
              git show origin/audit/deep-ownership-pass:tools/deep_audit_modules.py > /tmp/deep_audit_modules.py
              python3 /tmp/deep_audit_architecture.py
              python3 /tmp/deep_audit_modules.py
            elif git cat-file -e origin/audit/deep-ownership-pass:Engine/Schema.lua 2>/dev/null; then
              git archive origin/audit/deep-ownership-pass | tar -x
            else
              echo "Audit branch contains neither transformations nor validated result." >&2
              exit 1
            fi
          else
            echo "Ownership result is absent from main and the audit branch is unavailable." >&2
            exit 1
          fi

      - name: Apply final architecture and functional corrections
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          ROOT = Path(".")

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding="utf-8")

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              text = read(path)
              if old in text:
                  write(path, text.replace(old, new, 1))
                  return
              if new not in text:
                  raise SystemExit(f"{path}: missing patch anchor: {label}")

          def replace_range(path: str, start: str, end: str, replacement: str, label: str) -> None:
              text = read(path)
              try:
                  first = text.index(start)
                  last = text.index(end, first)
              except ValueError as error:
                  raise SystemExit(f"{path}: missing range anchor: {label}") from error
              write(path, text[:first] + replacement + text[last:])

          # Immutable SavedVariables schema. Overwrite the owner with one canonical
          # implementation so no earlier partial audit can survive.
          write("Engine/Schema.lua", r'''-- RothTooltip SavedVariables schema ownership.
          -- Defaults are immutable. Account and character scopes receive detached
          -- copies and cannot share mutable descendants with defaults or each other.

          local _, addon = ...

          local function DeepCopy(value, seen)
              if type(value) ~= "table" then return value end
              seen = seen or {}
              if seen[value] then return seen[value] end

              local copy = {}
              seen[value] = copy
              for key, child in pairs(value) do
                  copy[DeepCopy(key, seen)] = DeepCopy(child, seen)
              end
              local mt = getmetatable(value)
              if mt ~= nil then setmetatable(copy, mt) end
              return copy
          end

          function addon:DeepCopy(value)
              return DeepCopy(value)
          end

          function addon:FixNumericKey(tbl, seen)
              if type(tbl) ~= "table" then return tbl end
              seen = seen or {}
              if seen[tbl] then return tbl end
              seen[tbl] = true

              local converted = {}
              for key, value in pairs(tbl) do
                  if type(key) == "string" and string.match(key, "^[1-9]%d*$") then
                      tbl[key] = nil
                      converted[tonumber(key)] = value
                  end
              end
              for key, value in pairs(converted) do
                  if tbl[key] == nil then tbl[key] = value end
              end
              for _, value in pairs(tbl) do
                  if type(value) == "table" then self:FixNumericKey(value, seen) end
              end
              return tbl
          end

          local MergeDefaults

          local function ValidateElements(source, destination, active)
              local known = {}
              for rowIndex, row in ipairs(destination) do
                  known[rowIndex] = true
                  if type(row) == "table" then
                      for index = #row, 1, -1 do
                          local key = row[index]
                          if source[key] == nil then
                              table.remove(row, index)
                          else
                              known[key] = true
                          end
                      end
                  end
              end

              for key, defaultValue in pairs(source) do
                  if type(key) ~= "number" then
                      local currentValue = destination[key]
                      if currentValue == nil then
                          destination[key] = DeepCopy(defaultValue)
                          if key ~= "factionBig" and key ~= "npcTitle" and not known[key]
                              and type(destination[1]) == "table" then
                              table.insert(destination[1], 1, key)
                          end
                      elseif type(defaultValue) == "table" then
                          if type(currentValue) ~= "table" then
                              destination[key] = DeepCopy(defaultValue)
                          else
                              MergeDefaults(defaultValue, currentValue, active)
                          end
                      elseif type(currentValue) ~= type(defaultValue) then
                          destination[key] = defaultValue
                      end
                  end
              end
              return destination
          end

          MergeDefaults = function(source, destination, active)
              if type(source) ~= "table" then return destination end
              if type(destination) ~= "table" then destination = {} end

              active = active or {}
              if active[source] then return destination end
              active[source] = true

              for key, defaultValue in pairs(source) do
                  local currentValue = destination[key]
                  if key == "version" then
                      destination[key] = defaultValue
                  elseif currentValue == nil then
                      destination[key] = DeepCopy(defaultValue)
                  elseif key == "elements" and type(defaultValue) == "table"
                      and type(currentValue) == "table" then
                      destination[key] = ValidateElements(defaultValue, currentValue, active)
                  elseif type(defaultValue) == "table" then
                      if type(currentValue) ~= "table" then
                          destination[key] = DeepCopy(defaultValue)
                      else
                          MergeDefaults(defaultValue, currentValue, active)
                      end
                  elseif type(currentValue) ~= type(defaultValue) then
                      destination[key] = defaultValue
                  end
              end

              active[source] = nil
              return destination
          end

          function addon:MergeVariable(source, destination)
              return MergeDefaults(source, destination)
          end
          ''')

          toc = read("RothTooltip.toc")
          if "Engine\\Schema.lua" not in toc:
              toc = toc.replace("Engine\\Safe.lua\n", "Engine\\Safe.lua\nEngine\\Schema.lua\n", 1)
          write("RothTooltip.toc", toc)

          # Keep immutable defaults separate from the active account/character DB.
          config = read("Config.lua")
          if "addon.defaults = addon:DeepCopy(addon.db)" not in config:
              config = config.rstrip() + "\n\naddon.defaults = addon:DeepCopy(addon.db)\n"
          write("Config.lua", config)

          general = read("General.lua")
          general = general.replace(
              "addon.db = addon:MergeVariable(addon.db, RothTooltipDB)",
              "addon.db = addon:MergeVariable(addon.defaults or addon.db, RothTooltipDB)",
              1,
          )
          general = general.replace("local defaults = CopyTable(addon.db)", "local defaults = addon:DeepCopy(addon.db)")
          write("General.lua", general)

          # Action-like tooltips can represent item macros. Item evidence is resolved
          # before spell fallback and only ordinary fields enter the context.
          midnight = read("Engine/Midnight.lua")
          old_action = '''    local actionLike = context.type == petActionType
                  or context.type == flyoutType
                  or context.type == macroType
              if actionLike then
                  context.spellID = ReadNumber(tooltipData, "spellID")
                      or ReadNumber(tooltipData, "spellId")
                      or ResolveDisplayedSpellID(tooltip)
              end
          '''
          new_action = '''    local actionLike = context.type == petActionType
                  or context.type == flyoutType
                  or context.type == macroType
              if actionLike then
                  local _, displayedItemLink, displayedItemID = TooltipQuery(
                      TooltipUtil and TooltipUtil.GetDisplayedItem,
                      tooltip
                  )
                  displayedItemLink = NormalizeLink(displayedItemLink)
                  if type(displayedItemID) == "number" or displayedItemLink then
                      context.hyperlink = displayedItemLink or context.hyperlink
                      context.itemID = type(displayedItemID) == "number" and displayedItemID
                          or context.itemID
                      if not context.itemID and context.hyperlink then
                          context.itemID = ResolveItemID(context.hyperlink)
                      end
                      context.spellID = nil
                  else
                      context.spellID = ReadNumber(tooltipData, "spellID")
                          or ReadNumber(tooltipData, "spellId")
                          or ResolveDisplayedSpellID(tooltip)
                  end
              end
          '''
          if "TooltipUtil and TooltipUtil.GetDisplayedItem" not in midnight[midnight.find("local actionLike"):]:
              if old_action not in midnight:
                  raise SystemExit("Engine/Midnight.lua: action-like context anchor missing")
              midnight = midnight.replace(old_action, new_action, 1)

          # Never leave the right column from a Blizzard double line visible after
          # the addon hides its left column.
          old_hide = '''function addon:HideLine(tooltip, keyword)
              local line = self:FindLine(tooltip, keyword)
              if line and self:IsObjectAccessible(line) then
                  CallObjectMethod(line, "SetText", nil)
              end
          end
          '''
          new_hide = '''function addon:HideLine(tooltip, keyword)
              local left, _, right = self:FindLine(tooltip, keyword)
              if left and self:IsObjectAccessible(left) then
                  CallObjectMethod(left, "SetText", nil)
              end
              if right and self:IsObjectAccessible(right) then
                  CallObjectMethod(right, "SetText", nil)
              end
          end
          '''
          if old_hide in midnight:
              midnight = midnight.replace(old_hide, new_hide, 1)
          elif new_hide not in midnight:
              raise SystemExit("Engine/Midnight.lua: HideLine anchor missing")
          write("Engine/Midnight.lua", midnight)

          # Quest styling is processor-driven for all managed quest tooltip frames.
          write("Quest.lua", r'''local _, addon = ...
          local LibEvent = addon.LibEvent or LibStub:GetLibrary("LibEvent.7000")

          local function CanAccess(value)
              return addon:CanAccessValue(value)
          end

          local function ReadNumber(tbl, key)
              if not CanAccess(tbl) or type(tbl) ~= "table" then return nil end
              local value = addon:SafeGet(tbl, key)
              if type(value) == "number" then return value end
              return nil
          end

          local function GetQuestLevel(questID)
              local fn = C_QuestLog and C_QuestLog.GetQuestDifficultyLevel
              if type(fn) ~= "function" then return nil end
              local ok, level = pcall(fn, questID)
              if not ok or not CanAccess(level) or type(level) ~= "number" then return nil end
              if level >= 0 then return level end

              ok, level = pcall(UnitLevel, "player")
              if not ok or not CanAccess(level) or type(level) ~= "number" then return nil end
              return level
          end

          local function ApplyQuestColor(tooltip, questID)
              local config = addon.db and addon.db.quest
              if type(config) ~= "table" or config.coloredQuestBorder ~= true then return end
              if not addon:IsTooltipSafe(tooltip) or type(questID) ~= "number" then return end

              local level = GetQuestLevel(questID)
              if type(level) ~= "number" then return end
              local ok, color = pcall(GetQuestDifficultyColor, level)
              if not ok or not CanAccess(color) or type(color) ~= "table" then return end

              local red = ReadNumber(color, "r") or 1
              local green = ReadNumber(color, "g") or 1
              local blue = ReadNumber(color, "b") or 1
              LibEvent:trigger("tooltip.style.border.color", tooltip, red, green, blue)
          end

          local function OnGenericTooltip(_, tooltip, _, id, _, context)
              if not addon.MM:IsEnabled("Quest") then return end
              if addon.AllowTrigger and not addon:AllowTrigger("other", tooltip) then return end

              local questType = Enum and Enum.TooltipDataType and Enum.TooltipDataType.Quest
              if type(context) ~= "table" or context.type ~= questType then return end
              local questID = type(context.id) == "number" and context.id or id
              ApplyQuestColor(tooltip, questID)
          end

          local M = {}
          function M:Init() self.cbGeneric = OnGenericTooltip end
          function M:Enable()
              addon.MM:AttachTrigger("Quest", "tooltip:genericid", self.cbGeneric, "tooltip:genericid")
          end
          function M:Disable() end
          function M:OnTooltip(_) end
          function M:OnStyleChanged(_) end
          addon.MM:RegisterModule("Quest", M)
          ''')

          # Cursor coordinates are converted to UIParent's coordinate system, not
          # the independently scaled tooltip's coordinate system.
          anchor = read("Anchor.lua")
          anchor = anchor.replace("local scale = GetEffectiveScale(tip)", "local scale = GetEffectiveScale(UIParent)")
          write("Anchor.lua", anchor)

          # Model geometry is live configuration rather than creation-only state.
          model = read("Model.lua")
          if "local function ApplyModelLayout" not in model:
              marker = "local function EnsureModelFrame(tip)"
              layout = '''local function ApplyModelLayout(frame, tip)
              if not addon:IsObjectAccessible(frame) or not addon:IsTooltipSafe(tip) then return end
              local config = addon.db and addon.db.model or {}
              addon:SafeMethod(frame, "SetSize", tonumber(config.width) or 100, tonumber(config.height) or 100)
              addon:SafeMethod(frame, "ClearAllPoints")
              addon:SafeMethod(frame, "SetPoint", "BOTTOMRIGHT", tip, "TOPRIGHT",
                  tonumber(config.offsetX) or 8, tonumber(config.offsetY) or -16)
              addon:SafeMethod(frame, "SetFacing", tonumber(config.facing) or -0.25)
          end

          '''
              model = model.replace(marker, layout + marker, 1)
          creation = '''    addon:SafeMethod(frame, "SetSize", tonumber(config.width) or 100, tonumber(config.height) or 100)
              addon:SafeMethod(frame, "SetFacing", tonumber(config.facing) or -0.25)
              addon:SafeMethod(frame, "SetClampedToScreen", true)
              addon:SafeMethod(frame, "SetFrameStrata", "TOOLTIP")
              addon:SafeMethod(frame, "ClearAllPoints")
              addon:SafeMethod(
                  frame,
                  "SetPoint",
                  "BOTTOMRIGHT",
                  tip,
                  "TOPRIGHT",
                  tonumber(config.offsetX) or 8,
                  tonumber(config.offsetY) or -16
              )
          '''
          if creation in model:
              model = model.replace(creation, '''    addon:SafeMethod(frame, "SetClampedToScreen", true)
              addon:SafeMethod(frame, "SetFrameStrata", "TOOLTIP")
              ApplyModelLayout(frame, tip)
          ''', 1)
          update_start = model.find("    local config = addon.db and addon.db.model or {}", model.find("local function UpdateModel"))
          if update_start >= 0:
              update_end = model.find('    addon:SafeMethod(frame, "Show")', update_start)
              if update_end >= 0:
                  model = model[:update_start] + "    ApplyModelLayout(frame, tip)\n" + model[update_end:]
          if "function M:OnStyleChanged(_) end" in model:
              model = model.replace("function M:OnStyleChanged(_) end", '''function M:OnStyleChanged(_)
              if addon:IsObjectAccessible(modelFrame) and addon:SafeMethod(modelFrame, "IsShown") == true then
                  ApplyModelLayout(modelFrame, GameTooltip)
              end
          end''', 1)
          write("Model.lua", model)

          unit = read("Unit.lua")

          # Clear both columns for hidden/reformatted rows.
          old_range = '''local function HideLineRange(tip, first, last)
              local name = addon:SafeMethod(tip, "GetName")
              local lineCount = addon:SafeMethod(tip, "NumLines")
              if type(name) ~= "string" or type(lineCount) ~= "number" then return end

              last = math.min(last or lineCount, lineCount)
              for index = first, last do
                  local line = _G[name .. "TextLeft" .. index]
                  if addon:IsObjectAccessible(line) then addon:SafeMethod(line, "SetText", nil) end
              end
          end
          '''
          new_range = '''local function HideLineRange(tip, first, last)
              local name = addon:SafeMethod(tip, "GetName")
              local lineCount = addon:SafeMethod(tip, "NumLines")
              if type(name) ~= "string" or type(lineCount) ~= "number" then return end

              last = math.min(last or lineCount, lineCount)
              for index = first, last do
                  local left = _G[name .. "TextLeft" .. index]
                  local right = _G[name .. "TextRight" .. index]
                  if addon:IsObjectAccessible(left) then addon:SafeMethod(left, "SetText", nil) end
                  if addon:IsObjectAccessible(right) then addon:SafeMethod(right, "SetText", nil) end
              end
          end
          '''
          if old_range in unit:
              unit = unit.replace(old_range, new_range, 1)

          # Gray both columns for dead units.
          old_gray = '''    for index = 1, lineCount do
                  local line = _G[name .. "TextLeft" .. index]
                  if addon:IsObjectAccessible(line) then
                      local text = addon:SafeMethod(line, "GetText")
                      if CanAccess(text) and type(text) == "string" then
                          text = text:gsub("|cff%x%x%x%x%x%x", "|cffaaaaaa")
                          addon:SafeMethod(line, "SetText", text)
                      end
                      addon:SafeMethod(line, "SetTextColor", 0.7, 0.7, 0.7)
                  end
              end
          '''
          new_gray = '''    for index = 1, lineCount do
                  for _, suffix in ipairs({ "TextLeft", "TextRight" }) do
                      local line = _G[name .. suffix .. index]
                      if addon:IsObjectAccessible(line) then
                          local text = addon:SafeMethod(line, "GetText")
                          if CanAccess(text) and type(text) == "string" then
                              text = text:gsub("|cff%x%x%x%x%x%x", "|cffaaaaaa")
                              addon:SafeMethod(line, "SetText", text)
                          end
                          addon:SafeMethod(line, "SetTextColor", 0.7, 0.7, 0.7)
                      end
                  end
              end
          '''
          if old_gray in unit:
              unit = unit.replace(old_gray, new_gray, 1)

          # Do not steal Blizzard's single inspect channel while Inspect UI owns it.
          inspect_anchor = '''    if InCombatLockdown() then return end
              if type(CanInspect) ~= "function" or addon:SafeCallBoolean(CanInspect, unit) ~= true then return end
          '''
          inspect_new = '''    if InCombatLockdown() then return end
              if not ShouldClearInspectTarget() then return end
              if type(CanInspect) ~= "function" or addon:SafeCallBoolean(CanInspect, unit) ~= true then return end
          '''
          if inspect_anchor in unit:
              unit = unit.replace(inspect_anchor, inspect_new, 1)

          # Add bounded hot-path caches if the earlier functional audit did not.
          if "local FRIEND_ICON_CACHE_TTL" not in unit:
              unit = unit.replace(
                  "local MYTHIC_PLUS_CACHE_MAX = 64\n",
                  "local MYTHIC_PLUS_CACHE_MAX = 64\nlocal FRIEND_ICON_CACHE_TTL = 30\nlocal FRIEND_ICON_CACHE_MAX = 128\nlocal ROSTER_ZONE_CACHE_TTL = 1\n",
                  1,
              )

          friend_start = unit.find("function addon:GetFriendIcon(unit)")
          speed_start = unit.find("function addon:GetUnitSpeed(unit)", friend_start)
          if friend_start >= 0 and speed_start > friend_start and "local friendIconCache" not in unit:
              friend = r'''local friendIconCache = {}

          local function CacheFriendIcon(guid, icon, now)
              local count, oldestGUID, oldestTime = 0, nil, nil
              for cachedGUID, entry in pairs(friendIconCache) do
                  local stamp = type(entry) == "table" and entry.time or nil
                  if type(stamp) ~= "number" or now - stamp > FRIEND_ICON_CACHE_TTL then
                      friendIconCache[cachedGUID] = nil
                  else
                      count = count + 1
                      if oldestTime == nil or stamp < oldestTime then
                          oldestGUID, oldestTime = cachedGUID, stamp
                      end
                  end
              end
              if count >= FRIEND_ICON_CACHE_MAX and oldestGUID then friendIconCache[oldestGUID] = nil end
              friendIconCache[guid] = { icon = icon or false, time = now }
          end

          function addon:GetFriendIcon(unit)
              if self:IsUnitIdentityRestricted(unit) then return nil end
              if not self:SafeCallBoolean(UnitIsPlayer, unit) then return nil end

              local guid = Call(UnitGUID, unit)
              if type(guid) ~= "string" or guid == "" then return nil end
              local playerGUID = Call(UnitGUID, "player")
              if type(playerGUID) == "string" and guid == playerGUID then return nil end

              local now = GetTime and GetTime() or 0
              local cached = friendIconCache[guid]
              if type(cached) == "table" and type(cached.time) == "number"
                  and now - cached.time <= FRIEND_ICON_CACHE_TTL then
                  return cached.icon or nil
              end

              local icon
              if self:SafeCallBoolean(C_FriendList and C_FriendList.IsFriend, guid) then
                  icon = self.icons.friend
              else
                  local info = Call(C_BattleNet and C_BattleNet.GetAccountInfoByGUID, guid)
                  if type(info) == "table" and self:SafeBoolean(ReadField(info, "isFriend")) then
                      icon = self.icons.bnetfriend
                  end
              end
              CacheFriendIcon(guid, icon, now)
              return icon
          end

          '''
              unit = unit[:friend_start] + friend + unit[speed_start:]

          # Prefer a direct unit-map lookup; retain a one-second roster fallback.
          if "local rosterZoneCache" not in unit:
              zone_start = unit.find("local function GetRosterNameAndZone")
              info_start = unit.find("function addon:GetUnitInfo(unit)", zone_start)
              if zone_start >= 0 and info_start > zone_start:
                  zone = r'''local rosterZoneCache = { expires = 0, byName = {} }

          local function InvalidateRosterZoneCache()
              rosterZoneCache.expires = 0
              wipe(rosterZoneCache.byName)
          end

          local function RefreshRosterZoneCache()
              local now = GetTime and GetTime() or 0
              if now < rosterZoneCache.expires then return end
              wipe(rosterZoneCache.byName)

              local count = Call(GetNumGroupMembers)
              if type(count) ~= "number" then count = 0 end
              count = math.min(math.max(count, 0), 40)
              for index = 1, count do
                  local ok, name, _, _, _, _, _, zone = pcall(GetRaidRosterInfo, index)
                  if ok and CanAccessAll(name, zone) and type(name) == "string"
                      and type(zone) == "string" and zone ~= "" then
                      rosterZoneCache.byName[name] = zone
                      local shortName = name:match("^([^-]+)")
                      if shortName and rosterZoneCache.byName[shortName] == nil then
                          rosterZoneCache.byName[shortName] = zone
                      end
                  end
              end
              rosterZoneCache.expires = now + ROSTER_ZONE_CACHE_TTL
          end

          function addon:GetZone(unit, unitName, realm)
              if not CanAccessAll(unit, unitName, realm) then return nil end
              if type(unit) ~= "string" or type(unitName) ~= "string" or type(realm) ~= "string" then return nil end
              if self:SafeCallBoolean(IsInGroup) ~= true then return nil end

              local mapID = Call(C_Map and C_Map.GetBestMapForUnit, unit)
              if type(mapID) == "number" then
                  local mapInfo = Call(C_Map and C_Map.GetMapInfo, mapID)
                  local mapName = ReadString(mapInfo, "name")
                  if mapName then return mapName end
              end

              RefreshRosterZoneCache()
              return rosterZoneCache.byName[unitName .. "-" .. realm]
                  or rosterZoneCache.byName[unitName]
          end

          '''
                  unit = unit[:zone_start] + zone + unit[info_start:]

          if "self.cbRoster = InvalidateRosterZoneCache" not in unit and "local rosterZoneCache" in unit:
              unit = unit.replace(
                  "    self.cbInvalidate = InvalidateProgressCaches\n",
                  "    self.cbInvalidate = InvalidateProgressCaches\n    self.cbRoster = InvalidateRosterZoneCache\n",
                  1,
              )
          if '"GROUP_ROSTER_UPDATE"' not in unit and "self.cbRoster" in unit:
              unit = unit.replace(
                  '    addon.MM:AttachEvent("Unit", "BOSS_KILL", self.cbInvalidate, "BOSS_KILL")\n',
                  '    addon.MM:AttachEvent("Unit", "BOSS_KILL", self.cbInvalidate, "BOSS_KILL")\n'
                  '    addon.MM:AttachEvent("Unit", "GROUP_ROSTER_UPDATE", self.cbRoster, "GROUP_ROSTER_UPDATE")\n',
                  1,
              )
          write("Unit.lua", unit)

          # Item quality APIs have used both table/ColorMixin and RGB tuple shapes.
          item = read("Item.lua")
          start = item.find("local function GetQualityColor(quality)")
          end = item.find("local function OnTooltipItem", start)
          if start >= 0 and end > start:
              quality = r'''local function GetQualityColor(quality)
              local color = ITEM_QUALITY_COLORS and ITEM_QUALITY_COLORS[quality]
              if type(color) == "table" then
                  local red = addon:SafeGet(color, "r") or addon:SafeGet(color, 1)
                  local green = addon:SafeGet(color, "g") or addon:SafeGet(color, 2)
                  local blue = addon:SafeGet(color, "b") or addon:SafeGet(color, 3)
                  if type(red) == "number" and type(green) == "number" and type(blue) == "number" then
                      return red, green, blue
                  end
              end

              local fn = C_Item and C_Item.GetItemQualityColor
              if type(fn) == "function" then
                  local first, second, third = Call(fn, quality)
                  if type(first) == "table" then
                      local red = addon:SafeGet(first, "r") or addon:SafeGet(first, 1)
                      local green = addon:SafeGet(first, "g") or addon:SafeGet(first, 2)
                      local blue = addon:SafeGet(first, "b") or addon:SafeGet(first, 3)
                      if type(red) == "number" and type(green) == "number" and type(blue) == "number" then
                          return red, green, blue
                      end
                  elseif type(first) == "number" and type(second) == "number" and type(third) == "number" then
                      return first, second, third
                  end
              end
              return 1, 1, 1
          end

          '''
              item = item[:start] + quality + item[end:]
          write("Item.lua", item)

          # Ensure the ownership document and audit report describe the final tree.
          write("DEEP_AUDIT.md", r'''# Deep audit: module, state, and functional ownership

          This pass removes root architectural ambiguity rather than adding another
          compatibility wrapper.

          ## Corrected ownership defects

          - SavedVariables receive detached nested copies; immutable defaults are
            preserved separately from the active account or character database.
          - `Core.lua` no longer owns schema, TooltipData dispatch, visual rendering,
            anchoring, status-bar behavior, or unit presentation.
          - Feature subscriptions are owned by `Engine/ModuleManager.lua`; permanent
            hooks have explicit owners and disabled modules gate their callbacks.
          - Tooltip hook installation is tracked per script, so partial installation
            remains retryable after temporary restrictions.
          - Rendering no longer disables a complete Blizzard draw layer.

          ## Corrected functional defects

          - Item macros are classified from the documented displayed-item accessor
            before spell fallback.
          - Quest borders are driven through the sanitized TooltipData pipeline and
            no longer depend on a permanent ItemRef-only hook.
          - Cursor anchoring uses UIParent coordinates even when tooltip scale differs.
          - Hidden and dead-unit rows update both left and right tooltip columns.
          - Model size, offset, and facing update immediately after Settings changes.
          - Background inspect requests do not steal the channel while Blizzard's
            Inspect UI owns it.
          - Friend, Mythic+, inspect, and roster-zone work use bounded owner-local
            caches; unit map lookup is attempted before roster fallback.
          - Item quality color accepts both table/ColorMixin and RGB tuple contracts.

          ## Validation boundary

          Static checks cover Lua 5.1 syntax, schema isolation, file/load graph,
          ownership invariants, ModuleManager API use, forbidden legacy paths, and
          whitespace. Secure-context behavior still requires the live-client matrix in
          issue #1.
          ''')

          checker = read("tools/check_repo.py")
          # Extend the checker only once. The source-level checks intentionally avoid
          # trying to emulate the dynamic WoW global environment.
          if "def validate_module_manager_contract()" not in checker:
              extra = r'''

          def validate_module_manager_contract() -> None:
              manager = strip_lua_comments((ROOT / "Engine/ModuleManager.lua").read_text(encoding="utf-8"))
              feature_files = (
                  "General.lua", "Anchor.lua", "Target.lua", "Unit.lua", "Model.lua",
                  "Item.lua", "Spell.lua", "Quest.lua", "LinkID.lua", "Mount.lua",
                  "ExpansionInfo.lua", "SkinFrames.lua", "Engine/TooltipProcessor.lua",
              )
              used = set()
              registrations = []
              for relative in feature_files:
                  code = strip_lua_comments((ROOT / relative).read_text(encoding="utf-8"))
                  used.update(re.findall(r"addon\.MM:([A-Za-z_][A-Za-z0-9_]*)", code))
                  registrations.extend(re.findall(r'addon\.MM:RegisterModule\("([^"]+)"', code))
              defined = set(re.findall(r"function\s+(?:addon\.MM|MM):([A-Za-z_][A-Za-z0-9_]*)", manager))
              missing = sorted(used - defined)
              if missing:
                  fail(f"ModuleManager API methods are used but not defined: {missing}")
              duplicates = sorted({name for name in registrations if registrations.count(name) > 1})
              if duplicates:
                  fail(f"modules are registered more than once: {duplicates}")

              approved_hooks = {"Engine/Style.lua", "Anchor.lua", "LinkID.lua", "Core.lua"}
              for path in ROOT.rglob("*.lua"):
                  relative = path.relative_to(ROOT).as_posix()
                  code = strip_lua_comments(path.read_text(encoding="utf-8"))
                  if "hooksecurefunc" in code and relative not in approved_hooks:
                      fail(f"unowned permanent secure hook in {relative}")
          '''
              checker = checker.replace("\ndef main()", extra + "\ndef main()", 1)
              checker = checker.replace(
                  "    validate_ownership_boundaries()\n",
                  "    validate_ownership_boundaries()\n    validate_module_manager_contract()\n",
                  1,
              )

          # Final invariants added independent of earlier checker versions.
          if "def validate_deep_functional_invariants()" not in checker:
              extra = r'''

          def validate_deep_functional_invariants() -> None:
              midnight = strip_lua_comments((ROOT / "Engine/Midnight.lua").read_text(encoding="utf-8"))
              quest = strip_lua_comments((ROOT / "Quest.lua").read_text(encoding="utf-8"))
              anchor = strip_lua_comments((ROOT / "Anchor.lua").read_text(encoding="utf-8"))
              model = strip_lua_comments((ROOT / "Model.lua").read_text(encoding="utf-8"))
              unit = strip_lua_comments((ROOT / "Unit.lua").read_text(encoding="utf-8"))
              config = strip_lua_comments((ROOT / "Config.lua").read_text(encoding="utf-8"))
              general = strip_lua_comments((ROOT / "General.lua").read_text(encoding="utf-8"))

              if "TooltipUtil and TooltipUtil.GetDisplayedItem" not in midnight:
                  fail("action-like tooltips no longer resolve displayed items")
              if "hooksecurefunc" in quest or 'tooltip:genericid' not in quest:
                  fail("Quest.lua no longer uses processor-owned quest dispatch")
              if "GetEffectiveScale(UIParent)" not in anchor:
                  fail("cursor anchoring no longer uses UIParent coordinates")
              if "local function ApplyModelLayout" not in model:
                  fail("model layout is no longer live-configurable")
              for marker in (
                  "FRIEND_ICON_CACHE_TTL", "ROSTER_ZONE_CACHE_TTL",
                  "ShouldClearInspectTarget()", "C_Map and C_Map.GetBestMapForUnit",
              ):
                  if marker not in unit:
                      fail(f"Unit.lua lost deep-audit invariant: {marker}")
              if "addon.defaults = addon:DeepCopy(addon.db)" not in config:
                  fail("immutable defaults are no longer preserved")
              if "addon.defaults or addon.db" not in general:
                  fail("General.lua no longer initializes from immutable defaults")
              if "CopyTable(addon.db)" in general:
                  fail("character profile still relies on external CopyTable ownership")
              if "showTargetBy" in "\n".join(
                  path.read_text(encoding="utf-8")
                  for path in ROOT.rglob("*.lua")
              ):
                  fail("removed Targeted By implementation returned")
          '''
              checker = checker.replace("\ndef main()", extra + "\ndef main()", 1)
              if "    validate_module_manager_contract()\n" in checker:
                  checker = checker.replace(
                      "    validate_module_manager_contract()\n",
                      "    validate_module_manager_contract()\n    validate_deep_functional_invariants()\n",
                      1,
                  )
              else:
                  checker = checker.replace(
                      "    validate_runtime_invariants()\n",
                      "    validate_runtime_invariants()\n    validate_deep_functional_invariants()\n",
                      1,
                  )
          write("tools/check_repo.py", checker)

          changelog = read("CHANGELOG.md")
          if "### Converged deep audit" not in changelog:
              changelog = changelog.rstrip() + r'''

          ### Converged deep audit

          - Consolidated schema, runtime, rendering, anchor, status-bar, unit, and
            feature-module ownership without another compatibility layer.
          - Fixed item-macro classification, processor-driven quest styling, live model
            geometry, cursor scale math, double-column line cleanup, inspect-channel
            contention, direct unit-map lookup, and robust item quality colors.
          - Added immutable defaults, bounded hot-path caches, ModuleManager contract
            checks, and final deep functional invariants.
          ''' + "\n"
          write("CHANGELOG.md", changelog)
          PY

      - name: Remove all one-time audit, promoter, and finalizer artifacts
        run: |
          rm -rf .refactor_payload
          rm -f tools/deep_audit_refactor.py
          rm -f tools/deep_audit_architecture.py
          rm -f tools/deep_audit_modules.py
          rm -f tools/_deep_audit_probe.txt
          rm -f tools/_deep_audit_retrigger.txt
          rm -f tools/_post_final_hardening.py
          rm -f tools/_post_final_hardening_v2.py
          rm -f tools/_post_final_hardening_v3.py
          rm -f tools/_post_final_hardening_v4_prepare.py
          rm -f tools/_check_repo_hardened.py
          rm -f .github/workflows/deep-ownership-audit.yml
          rm -f .github/workflows/deep-ownership-audit-v2.yml
          rm -f .github/workflows/promote-deep-ownership-audit.yml
          rm -f .github/workflows/promote-deep-ownership-audit-v2.yml
          rm -f .github/workflows/deep-audit-finalizer.yml
          rm -f .github/workflows/deep-functional-audit.yml
          rm -f .github/workflows/deep-audit-convergence.yml
          rm -f .github/workflows/apply-single-runtime.yml
          rm -f .github/workflows/finalize-main.yml
          rm -f .github/workflows/force-finalize-main.yml
          rm -f .github/workflows/finalize-retail-12-1-authoritative.yml
          rm -f .github/workflows/finalize-and-report-retail-12-1.yml
          rm -f .github/workflows/main-authoritative-finalizer.yml
          rm -f .github/workflows/post-final-runtime-hardening.yml
          rm -f .github/workflows/post-final-runtime-hardening-v2.yml
          rm -f .github/workflows/post-final-runtime-hardening-v3.yml
          rm -f .github/workflows/post-final-runtime-hardening-v4.yml
          rm -f .github/workflows/audit-source-export.yml
          rm -f .github/workflows/audit-donors-export.yml

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Validate exact converged tree
        run: |
          find . -type f -name '*.lua' -not -path './.git/*' -print0 \
            | sort -z \
            | xargs -0 -n 1 luac5.1 -p
          lua5.1 tests/schema_ownership.lua
          python3 tools/check_repo.py
          git diff --check

      - name: Commit, rebase, and publish the converged tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Converge deep Roth Tooltip audit"
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          FINAL_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$FINAL_SHA" = "$REMOTE_MAIN"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      - name: Record completed audit in issue 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "Converged deep Roth Tooltip audit is on \`main\` at \`$FINAL_SHA\`. The exact tree passed Lua 5.1 parsing, schema-isolation regression tests, repository/runtime ownership invariants, ModuleManager API checks, deep functional invariants, and whitespace validation. All one-time audit/finalizer files were removed. Issue #1 remains open only for live-client validation."
          if [ "$(gh pr view 3 --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || true)" = "OPEN" ]; then
            gh pr close 3 --repo "$GITHUB_REPOSITORY" --comment "Superseded by the converged validated audit already published to main at $FINAL_SHA."
          fi

      - name: Remove temporary branches
        run: |
          for branch in \
            audit/deep-ownership-pass \
            audit/deep-ownership-pass-v2 \
            refactor/single-runtime-12.1.0 \
            update/retail-12.1.0 \
            noop-probe-finalizer \
            noop-probe-finalizer-2 \
            noop-probe-finalizer-3 \
            noop-probe-finalizer-4 \
            noop-probe-finalizer-5 \
            noop-probe-finalizer-6 \
            noop-probe-finalizer-7 \
            noop-probe-finalizer-8
          do
            git push origin --delete "$branch" || true
          done
