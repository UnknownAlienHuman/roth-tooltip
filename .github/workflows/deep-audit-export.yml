name: Deep audit branch export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package current PR source
        run: |
          zip -qr roth-tooltip-deep-audit.zip . \
            -x '.git/*' \
            -x 'roth-tooltip-deep-audit.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: roth-tooltip-deep-audit
          path: roth-tooltip-deep-audit.zip
          retention-days: 1
          if-no-files-found: error
