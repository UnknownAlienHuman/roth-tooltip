name: Final Retail 12.1 runtime hardening

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: roth-tooltip-main-runtime-hardening
  cancel-in-progress: false

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Materialize the single runtime when an earlier finalizer is still pending
        run: |
          if [ -f Engine/TooltipRegistry.lua ] \
            && [ ! -f Engine/TooltipBootstrap.lua ] \
            && [ ! -f Engine/Runtime12_1.lua ] \
            && ! grep -R --include='*.lua' -q 'dataTypes.Action' .; then
            exit 0
          fi

          git fetch origin refactor/single-runtime-12.1.0:refs/remotes/origin/refactor/single-runtime-12.1.0
          if git cat-file -e 'origin/refactor/single-runtime-12.1.0:.refactor_payload/apply.py' 2>/dev/null; then
            git checkout origin/refactor/single-runtime-12.1.0 -- .refactor_payload
            python3 .refactor_payload/apply.py
          else
            git archive origin/refactor/single-runtime-12.1.0 | tar -x
            rm -f Engine/TooltipBootstrap.lua Engine/Runtime12_1.lua Compat_MoneyFrame.lua todo.md
          fi

      - name: Apply final context, refresh, cache, and hook hardening
        run: python3 tools/_post_final_hardening.py

      - name: Remove one-time material
        run: |
          rm -rf .refactor_payload
          rm -f tools/_post_final_hardening.py
          rm -f .github/workflows/apply-single-runtime.yml
          rm -f .github/workflows/finalize-main.yml
          rm -f .github/workflows/force-finalize-main.yml
          rm -f .github/workflows/finalize-retail-12-1-authoritative.yml
          rm -f .github/workflows/finalize-and-report-retail-12-1.yml
          rm -f .github/workflows/main-authoritative-finalizer.yml
          rm -f .github/workflows/post-final-runtime-hardening.yml
          rm -f .github/workflows/audit-source-export.yml
          rm -f .github/workflows/audit-donors-export.yml

      - name: Install Lua 5.1 parser
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Parse every Lua file
        run: |
          find . -type f -name '*.lua' -not -path './.git/*' -print0 \
            | sort -z \
            | xargs -0 -n 1 luac5.1 -p

      - name: Validate repository and Retail 12.1 invariants
        run: python3 tools/check_repo.py

      - name: Commit and publish hardened tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Harden final Retail 12.1 tooltip runtime"
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          FINAL_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$REMOTE_MAIN" = "$FINAL_SHA"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      - name: Wait for static checks on the exact main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 90); do
            RUN_JSON="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$FINAL_SHA&per_page=50")"
            STATUS="$(jq -r '[.workflow_runs[] | select(.name == "Static checks")][0].status // "missing"' <<<"$RUN_JSON")"
            CONCLUSION="$(jq -r '[.workflow_runs[] | select(.name == "Static checks")][0].conclusion // ""' <<<"$RUN_JSON")"
            if [ "$STATUS" = "completed" ]; then
              test "$CONCLUSION" = "success"
              exit 0
            fi
            sleep 10
          done
          echo "Static checks did not complete for $FINAL_SHA" >&2
          exit 1

      - name: Record the hardened main state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "Final Retail 12.1 hardening is on \`main\` at \`$FINAL_SHA\`. The exact commit passed Lua 5.1 parsing, \`tools/check_repo.py\`, the remote-main SHA check, and the separate GitHub Actions \`Static checks\` workflow. Context invalidation is fail-closed, refresh is type-preserving, Mythic+ cache entries are sanitized, NotifyInspect is globally throttled, and item-cache refresh is centralized. Static repository work is complete; this issue remains open only for live-client validation."

      - name: Remove temporary remote branches
        run: |
          for branch in \
            noop-probe-finalizer \
            noop-probe-finalizer-2 \
            noop-probe-finalizer-3 \
            noop-probe-finalizer-4 \
            noop-probe-finalizer-5 \
            noop-probe-finalizer-6 \
            noop-probe-finalizer-7 \
            noop-probe-finalizer-8 \
            audit/post-merge-12.1.0 \
            update/retail-12.1.0 \
            refactor/single-runtime-12.1.0
          do
            git push origin --delete "$branch" || true
          done
