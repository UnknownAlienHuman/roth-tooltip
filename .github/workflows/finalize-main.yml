name: Finalize Retail 12.1 refactor into main

on:
  push:
    branches:
      - refactor/single-runtime-12.1.0

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/single-runtime-12.1.0
          fetch-depth: 0

      - name: Apply staged refactor when still pending
        run: |
          if [ -f .refactor_payload/apply.py ]; then
            python3 .refactor_payload/apply.py
          fi

      - name: Remove one-time staging workflows
        run: |
          rm -rf .refactor_payload
          rm -f .github/workflows/apply-single-runtime.yml
          rm -f .github/workflows/finalize-main.yml

      - name: Install Lua 5.1 parser
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Parse every Lua file
        run: |
          find . -type f -name '*.lua' -not -path './.git/*' -print0 \
            | sort -z \
            | xargs -0 -n 1 luac5.1 -p

      - name: Validate repository and runtime invariants
        run: python3 tools/check_repo.py

      - name: Commit final tree and fast-forward main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize single Retail 12.1 tooltip runtime"
          fi
          git push origin HEAD:main
