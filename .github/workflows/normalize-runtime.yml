name: Normalize runtime sources

on:
  push:

permissions:
  contents: write

jobs:
  normalize:
    if: github.ref == 'refs/heads/update/retail-12.1.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: update/retail-12.1.0
          fetch-depth: 0

      - name: Apply exact source replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core = Path("Core.lua")
          text = core.read_text(encoding="utf-8")
          old = '''local __IsSecretBase = (type(issecretvalue) == "function") and issecretvalue or nil

          -- Robust SecretValue detection:
          -- Some SecretValue values do not report via issecretvalue(), but still hard-error
          -- on any Lua comparison. Detect via a protected self-compare.
          local function IsSecret(v)
              if (__IsSecretBase and __IsSecretBase(v)) then
                  return true
              end
              -- Never do boolean tests or comparisons on unknown values.
              -- Self-compare inside pcall is the most reliable generic probe.
              local ok = pcall(function() return v == v end)
              return not ok
          end
          '''
          new = '''local __CanAccessValue = (type(canaccessvalue) == "function") and canaccessvalue or nil
          local __IsSecretBase = (type(issecretvalue) == "function") and issecretvalue or nil

          -- Legacy Core helpers still call this local predicate. Keep it aligned with
          -- the Retail 12.1 capability contract: gate directly and never probe a
          -- value through comparison or protected retry.
          local function IsSecret(v)
              if (__CanAccessValue) then
                  return __CanAccessValue(v) ~= true
              end
              if (__IsSecretBase) then
                  return __IsSecretBase(v) == true
              end
              return false
          end
          '''
          if old in text:
              core.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("Core.lua secret gate block no longer matches the expected source")

          unit = Path("Unit.lua")
          text = unit.read_text(encoding="utf-8")
          old = '''        local now = GetTime and GetTime() or 0
                  PruneInspectCache(now)
                  inspectCache[guid] = {
                      ilvl = itemLevel,
                      specID = specID,
                      time = now,
                  }
                  inspectCacheCount = inspectCacheCount + 1
          '''
          new = '''        local now = GetTime and GetTime() or 0
                  PruneInspectCache(now)
                  local isNewEntry = inspectCache[guid] == nil
                  inspectCache[guid] = {
                      ilvl = itemLevel,
                      specID = specID,
                      time = now,
                  }
                  if isNewEntry then
                      inspectCacheCount = inspectCacheCount + 1
                  end
          '''
          if old in text:
              unit.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("Unit.lua inspect cache block no longer matches the expected source")

          general = Path("General.lua")
          text = general.read_text(encoding="utf-8")
          old = '    if type(general) ~= "table" or general.statusbarText ~= true or bar.forceHideText == true then\n'
          new = '    if type(general) ~= "table" or general.statusbarText ~= true\n        or addon:SafeGet(bar, "forceHideText") == true then\n'
          if old in text:
              general.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("General.lua status text gate no longer matches the expected source")
          PY

      - name: Commit normalized sources
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Core.lua Unit.lua General.lua
          git commit -m "Normalize remaining Retail 12.1 gates"
          git push origin HEAD:update/retail-12.1.0
