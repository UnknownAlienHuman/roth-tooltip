name: Finalize and report Retail 12.1

on:
  push:
    branches:
      - refactor/single-runtime-12.1.0

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: roth-tooltip-retail-12-1-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out authoritative refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/single-runtime-12.1.0
          fetch-depth: 0

      - name: Apply staged refactor only when pending
        run: |
          if [ -f .refactor_payload/apply.py ]; then
            python3 .refactor_payload/apply.py
          fi

      - name: Remove all one-time staging and audit material
        run: |
          rm -rf .refactor_payload
          rm -f .github/workflows/apply-single-runtime.yml
          rm -f .github/workflows/finalize-main.yml
          rm -f .github/workflows/force-finalize-main.yml
          rm -f .github/workflows/finalize-retail-12-1-authoritative.yml
          rm -f .github/workflows/finalize-and-report-retail-12-1.yml
          rm -f .github/workflows/audit-source-export.yml
          rm -f .github/workflows/audit-donors-export.yml

      - name: Install Lua 5.1 parser
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Parse every Lua file
        run: |
          find . -type f -name '*.lua' -not -path './.git/*' -print0 \
            | sort -z \
            | xargs -0 -n 1 luac5.1 -p

      - name: Validate repository and Retail 12.1 invariants
        run: python3 tools/check_repo.py

      - name: Commit and rebase validated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize authoritative Retail 12.1 tooltip runtime"
          fi
          git fetch origin main
          git rebase origin/main

      - name: Publish exact tree to refactor branch and main
        run: |
          git push --force-with-lease origin HEAD:refactor/single-runtime-12.1.0
          git push origin HEAD:main
          FINAL_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$REMOTE_MAIN" = "$FINAL_SHA"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      - name: Record finalization in live-test issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "Retail 12.1 single-runtime refactor was published to \`main\` at \`$FINAL_SHA\`. The finalizer passed Lua 5.1 parsing and \`tools/check_repo.py\` before verifying the remote main SHA. Static repository work is complete; keep this issue open only for the live-client matrix (reload, combat/restriction transitions, unit/item/spell/aura surfaces, inspect, model, status bar, Settings, Doctor and taint output)."

      - name: Remove temporary remote branches
        run: |
          for branch in \
            noop-probe-finalizer \
            noop-probe-finalizer-2 \
            noop-probe-finalizer-3 \
            noop-probe-finalizer-4 \
            noop-probe-finalizer-5 \
            noop-probe-finalizer-6 \
            noop-probe-finalizer-7 \
            noop-probe-finalizer-8 \
            audit/post-merge-12.1.0 \
            update/retail-12.1.0
          do
            git push origin --delete "$branch" || true
          done
