name: Main authoritative Retail 12.1 finalizer

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: roth-tooltip-main-retail-12-1-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Materialize authoritative single runtime when needed
        run: |
          if [ -f Engine/TooltipRegistry.lua ] \
            && [ ! -f Engine/TooltipBootstrap.lua ] \
            && [ ! -f Engine/Runtime12_1.lua ] \
            && ! grep -R --include='*.lua' -q 'dataTypes.Action' .; then
            echo 'Authoritative runtime is already present on main.'
            exit 0
          fi

          git fetch origin refactor/single-runtime-12.1.0:refs/remotes/origin/refactor/single-runtime-12.1.0
          if git cat-file -e 'origin/refactor/single-runtime-12.1.0:.refactor_payload/apply.py' 2>/dev/null; then
            git checkout origin/refactor/single-runtime-12.1.0 -- .refactor_payload
            python3 .refactor_payload/apply.py
          else
            git reset --hard origin/refactor/single-runtime-12.1.0
          fi

      - name: Remove all one-time staging and audit material
        run: |
          rm -rf .refactor_payload
          rm -f .github/workflows/apply-single-runtime.yml
          rm -f .github/workflows/finalize-main.yml
          rm -f .github/workflows/force-finalize-main.yml
          rm -f .github/workflows/finalize-retail-12-1-authoritative.yml
          rm -f .github/workflows/finalize-and-report-retail-12-1.yml
          rm -f .github/workflows/main-authoritative-finalizer.yml
          rm -f .github/workflows/audit-source-export.yml
          rm -f .github/workflows/audit-donors-export.yml

      - name: Install Lua 5.1 parser
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Parse every Lua file
        run: |
          find . -type f -name '*.lua' -not -path './.git/*' -print0 \
            | sort -z \
            | xargs -0 -n 1 luac5.1 -p

      - name: Validate repository and Retail 12.1 invariants
        run: python3 tools/check_repo.py

      - name: Commit and publish exact final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize authoritative Retail 12.1 tooltip runtime"
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          FINAL_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$REMOTE_MAIN" = "$FINAL_SHA"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      - name: Record final state in issue 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "Authoritative Retail 12.1 runtime is now on \`main\` at \`$FINAL_SHA\`. The publishing workflow parsed every Lua file with Lua 5.1, passed \`tools/check_repo.py\`, and verified that the remote main ref equals the validated commit. Static repository work is complete. This issue remains open only for the live-client matrix."

      - name: Remove temporary remote branches
        run: |
          for branch in \
            noop-probe-finalizer \
            noop-probe-finalizer-2 \
            noop-probe-finalizer-3 \
            noop-probe-finalizer-4 \
            noop-probe-finalizer-5 \
            noop-probe-finalizer-6 \
            noop-probe-finalizer-7 \
            noop-probe-finalizer-8 \
            audit/post-merge-12.1.0 \
            update/retail-12.1.0
          do
            git push origin --delete "$branch" || true
          done
