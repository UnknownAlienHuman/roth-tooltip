name: Service-document language boundary

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify technical English and preserved ruRU localization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cyrillic = re.compile(r'[А-Яа-яЁё]')
          todo = Path('todo.md').read_text(encoding='utf-8')
          if cyrillic.search(todo):
              raise SystemExit('todo.md still contains Cyrillic service text')

          ru = Path('locales/ruRU.lua').read_text(encoding='utf-8')
          if not cyrillic.search(ru):
              raise SystemExit('ruRU localization was unexpectedly removed')
          if 'locales\\ruRU.lua' not in Path('locales/locales.xml').read_text(encoding='utf-8'):
              raise SystemExit('ruRU localization load path is missing')
          print('Language boundary: PASS')
          PY

      - name: Run existing repository checks
        run: python3 tools/check_repo.py
