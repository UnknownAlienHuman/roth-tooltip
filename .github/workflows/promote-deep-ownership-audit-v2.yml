name: Promote deep ownership audit v2

on:
  workflow_run:
    workflows:
      - Deep ownership audit v2
    types:
      - completed

permissions:
  contents: write
  issues: write

concurrency:
  group: roth-tooltip-promote-deep-ownership-audit-v2
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'audit/deep-ownership-pass'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/deep-ownership-pass
          fetch-depth: 0

      - name: Verify cleaned result
        run: |
          test -f Engine/Schema.lua
          test -f OWNERSHIP.md
          test -f tests/schema_ownership.lua
          test ! -f tools/deep_audit_architecture.py
          test ! -f tools/deep_audit_modules.py
          test ! -f .github/workflows/deep-ownership-audit-v2.yml
          grep -q 'Refactor module and state ownership' <(git log -1 --pretty=%B)

      - name: Rebase over main and remove one-time promoters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          rm -f .github/workflows/promote-deep-ownership-audit.yml
          rm -f .github/workflows/promote-deep-ownership-audit-v2.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove one-time deep-audit promoters"
          fi

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Re-run exact validation after rebase
        run: |
          find . -type f -name '*.lua' -not -path './.git/*' -print0 \
            | sort -z \
            | xargs -0 -n 1 luac5.1 -p
          lua5.1 tests/schema_ownership.lua
          python3 tools/check_repo.py

      - name: Publish validated tree to main
        run: |
          git push origin HEAD:main
          FINAL_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$FINAL_SHA" = "$REMOTE_MAIN"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      - name: Record completed deep audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "Deep module/state ownership audit was promoted to \`main\` at \`$FINAL_SHA\`. The exact rebased tree passed Lua 5.1 parsing, schema-isolation tests, and repository/runtime ownership invariants. Static lint remains diagnostic because Blizzard's dynamic global environment cannot be represented reliably by generic luacheck. Live-client validation remains open."

      - name: Remove audit branch
        run: git push origin --delete audit/deep-ownership-pass || true
