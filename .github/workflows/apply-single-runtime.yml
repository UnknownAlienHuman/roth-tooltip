name: Apply single Retail 12.1 runtime

on:
  push:
    branches:
      - refactor/single-runtime-12.1.0

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/single-runtime-12.1.0
          fetch-depth: 0

      - name: Apply audited source transformation
        run: python3 .refactor_payload/apply.py

      - name: Remove one-time staging material
        run: |
          rm -rf .refactor_payload
          rm -f .github/workflows/apply-single-runtime.yml

      - name: Install Lua 5.1 parser
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Parse every Lua file
        run: |
          find . -type f -name '*.lua' -not -path './.git/*' -print0 \
            | sort -z \
            | xargs -0 -n 1 luac5.1 -p

      - name: Validate repository and runtime invariants
        run: python3 tools/check_repo.py

      - name: Commit validated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate Retail 12.1 tooltip runtime"
          git push origin HEAD:refactor/single-runtime-12.1.0
