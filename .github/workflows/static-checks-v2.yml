name: Static checks v2

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Parse every Lua file
        run: |
          find . -type f -name '*.lua' -not -path './.git/*' -print0 \
            | sort -z \
            | xargs -0 -n 1 luac5.1 -p

      - name: Run repository ownership checks
        run: python3 tools/check_repo_v2.py

      - name: Run Lua regression tests
        run: |
          for test_file in tests/*.lua; do
            echo "::group::$test_file"
            lua5.1 "$test_file"
            echo "::endgroup::"
          done
